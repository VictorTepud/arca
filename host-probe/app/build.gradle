plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.arca.probe'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.arca.probe'
        minSdk 24
        // ⚠️ NO SUBIR: targetSdk 28 es lo que permite ejecutar binarios
        // propios desde el directorio de datos. Es la clave de Arca.
        targetSdk 28
        versionCode 3
        versionName '0.3.0-r3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Sin dependencias: solo framework Android + Java estándar.
}

# Cross-compilación SIN NDK (decisión de arquitecto, worklog T17):
# rust-lld viene dentro de la toolchain de rustup y produce exactamente lo
# que Android necesita ejecutar desde filesDir: ELF estático-PIE
# (Type=DYN + sin DT_NEEDED — gate de readelf del README de devapp-hello).
#
# Con esto, arca.sh puede armar el APK del probe F0 sin instalar el NDK:
#   cargo build -p devapp-hello --target aarch64-unknown-linux-musl --release
#
# (x86_64 musl — el que usa el e2e en PC — ya es static-pie por defecto y
# enlaza con el cc del sistema, por eso no aparece aquí.)

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "relocation-model=pic",
    "-C", "link-arg=-pie",
]

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "relocation-model=pic",
    "-C", "link-arg=-pie",
]

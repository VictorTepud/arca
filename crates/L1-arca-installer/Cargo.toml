[package]
name = "arca-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "verify→extract→register atómico de paquetes .arca"

[dependencies]
arca-7z = { path = "../L0-arca-7z" }
arca-pkg-model = { path = "../L0-arca-pkg-model" }
arca-sign = { path = "../L0-arca-sign" }
arca-store = { path = "../L1-arca-store" }
arca-types = { path = "../L0-arca-types" }
semver = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
# Firma de fixtures de test (solo dev: el host nunca lleva `signer`).
arca-sign = { path = "../L0-arca-sign", features = ["signer"] }
semver = { workspace = true }
sevenz-rust2 = { workspace = true }
tempfile = { workspace = true }

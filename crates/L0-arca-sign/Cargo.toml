[package]
name = "arca-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ed25519 verify + digest blake3 canónico de paquetes .arca"

[dependencies]
arca-types = { path = "../L0-arca-types" }
blake3 = { workspace = true }
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = { workspace = true }
getrandom = "0.4"
sha2 = "0.10"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
# Lado herramientas (Deepin): keygen + firma. El host NUNCA activa `signer`
# (cero secretos en el dispositivo, spec 08 §4).
signer = []

[lib]

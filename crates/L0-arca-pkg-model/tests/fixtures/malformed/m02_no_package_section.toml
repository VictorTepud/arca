[runtime]
backend_pref  = "any"
entry         = "app"
respawn       = "on-crash"
perms         = ["net.client", "clipboard.write"]
ui            = { sync = false, windows = "single", atlas = 2048, fonts = ["assets/fonts/inter.ttf"] }

[artifacts.native]
path     = "bin/native-aarch64/app"
sha256   = "abababababababababababababababababababababababababababababababab"

[artifacts.wasm]
path     = "bin/wasm/app.wasm"
aot      = "bin/wasm/app.aot"
sha256   = "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
wasm_runtime = "wamr-aot"

[profile]
launch_budget_ms = 120
max_frame_mb     = 2
